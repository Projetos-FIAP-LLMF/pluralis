version: "3.8"

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: oracle-db
    ports:
      - "1521:1521"
    env_file: .env
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD}
      APP_USER: ${APP_USER}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD}
    volumes:
      - oracle-data:/opt/oracle/oradata
    # healthcheck opcional (testa apenas a porta)
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/1521"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 60s

  pluralis-app:
    build:
      context: .
    container_name: pluralis-app
    depends_on:
      - oracle-db
    ports:
      - "8080:8080"
    env_file: .env

volumes:
  oracle-data:
